name: Fetch concerts iCal

on:
  schedule:
    - cron: '0 3 * * *'   # cada nit a les 3:00 UTC
  workflow_dispatch:        # permet executar-lo manualment

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Reintentar fins a 3 cops si falla (ex: timeout, rate limit)
    strategy:
      matrix:
        attempt: [1, 2, 3]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download iCal (intent ${{ matrix.attempt }}/3)
        id: download
        run: |
          mkdir -p static/data
          for i in {1..3}; do
            if curl -L --fail --silent --show-error --max-time 30 \
              "https://calendar.google.com/calendar/ical/7713a217c6e9631a76ac934719903101dbbc9550c23cfb6dc082c9114d8bf981%40group.calendar.google.com/public/basic.ics" \
              -o static/data/concerts.txt; then
              echo "Descàrrega exitosa a l'intent $i"
              echo "success=true" >> $GITHUB_OUTPUT
              break
            else
              echo "Intent $i fallat, esperant 10s..."
              sleep 10
            fi
          done
          if [ "${{ steps.download.outputs.success }}" != "true" ]; then
            echo "Tots els intents han fallat"
            exit 1
          fi
          echo "Fitxer descarregat:"
          wc -l static/data/concerts.txt

      - name: Commit if changed
        if: steps.download.outputs.success == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/concerts.txt
          git diff --staged --quiet || {
            git commit -m "chore: actualitzar concerts.ics [skip ci]"
            git pull --rebase origin main
            git push
          }

      - name: Notify on failure (after all retries)
        if: failure() && matrix.attempt == 3
        run: |
          echo "::error::Fetch concerts iCal failed after 3 attempts"
          # Creates an issue in the repo to notify
          gh issue create \
            --title "🚨 Fetch concerts iCal failed after 3 retries" \
            --body "The scheduled workflow to fetch concerts from Google Calendar has failed after 3 retry attempts.\n\n**Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nPlease check the workflow logs and manually trigger the workflow if needed." \
            --label "bug,automation" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}