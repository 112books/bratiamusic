name: Fetch concerts iCal

on:
  schedule:
    - cron: '0 3 * * *'   # cada nit a les 3:00 UTC
  workflow_dispatch:        # permet executar-lo manualment

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download iCal (amb reintents)
        id: download
        run: |
          mkdir -p static/data
          success=false
          for attempt in 1 2 3; do
            echo "Intent $attempt/3..."
            if curl -L --fail --silent --show-error --max-time 30 \
              "https://calendar.google.com/calendar/ical/7713a217c6e9631a76ac934719903101dbbc9550c23cfb6dc082c9114d8bf981%40group.calendar.google.com/public/basic.ics" \
              -o static/data/concerts.txt; then
              echo "Descàrrega exitosa a l'intent $attempt"
              success=true
              break
            else
              echo "Intent $attempt fallat, esperant 10s..."
              sleep 10
            fi
          done
          if [ "$success" != "true" ]; then
            echo "Tots els intents han fallat"
            exit 1
          fi
          echo "Fitxer descarregat:"
          wc -l static/data/concerts.txt

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/concerts.txt
          git diff --staged --quiet || {
            git commit -m "chore: actualitzar concerts.ics"
            git pull --rebase origin main
            git push
          }

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Fetch concerts iCal failed after 3 attempts"
          gh issue create \
            --title "🚨 Fetch concerts iCal failed after 3 retries" \
            --body "The scheduled workflow to fetch concerts from Google Calendar has failed after 3 retry attempts.\n\n**Workflow run:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\n\nPlease check the workflow logs and manually trigger the workflow if needed." \
            --label "bug,automation" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}