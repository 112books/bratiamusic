name: Fetch YouTube videos

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch i processa vídeos de YouTube
        run: |
          mkdir -p static/data
          pip install -q yt-dlp
          yt-dlp \
            --flat-playlist \
            --dump-single-json \
            --no-warnings \
            --playlist-end 50 \
            "https://www.youtube.com/channel/UCXqrXtF9DiXVmfB4X8RX6gA/videos" \
            > /tmp/yt-playlist.json
          echo "Entrades rebudes: $(python3 -c "import json,sys; d=json.load(open('/tmp/yt-playlist.json')); print(len(d.get('entries',[])), 'vídeos')")"
          python3 scripts/process-youtube.py /tmp/yt-playlist.json static/data/videos.json

      - name: Commit si hi ha canvis
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/videos.json
          git diff --staged --quiet || {
            git commit -m "chore: actualitzar videos.json [skip ci]"
            git pull --rebase origin main
            git push
          }